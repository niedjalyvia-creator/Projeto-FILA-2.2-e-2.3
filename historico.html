<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Histórico de Edição</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; }
        .card { background: #fff; padding: 20px; border-radius: 8px; max-width: 400px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        textarea, button { width: 100%; padding: 8px; margin-top: 8px; margin-bottom: 12px; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 80px; }
        button { background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2980b9; }
        .res { font-weight: bold; margin-top: 5px; font-size: 0.9rem; color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h2>3. Histórico de Edição (Ctrl+Z)</h2>
        <textarea id="textoArea" placeholder="Digite seu texto aqui..." oninput="salvarTexto()"></textarea>
        <button onclick="desfazer()">Desfazer (Ctrl+Z)</button>
        <div class="res" id="resHistorico">Estados na pilha: 0</div>
    </div>

    <script>
        class Stack {
            constructor() { this.items = []; }
            push(el) { this.items.push(el); }
            pop() { return this.items.pop(); }
            isEmpty() { return this.items.length === 0; }
            size() { return this.items.length; }
        }

        let pilhaHistorico = new Stack();
        let ultimoTexto = "";

        function salvarTexto() {
            let textarea = document.getElementById('textoArea');
            let textoAtual = textarea.value;

            if (textoAtual !== ultimoTexto) {
                pilhaHistorico.push(ultimoTexto);
                ultimoTexto = textoAtual;
                document.getElementById('resHistorico').innerText = "Estados na pilha: " + pilhaHistorico.size();
            }
        }

        function desfazer() {
            let textarea = document.getElementById('textoArea');

            if (!pilhaHistorico.isEmpty()) {
                let anterior = pilhaHistorico.pop();
                textarea.value = anterior;
                ultimoTexto = anterior;
                document.getElementById('resHistorico').innerText = "Estados na pilha: " + pilhaHistorico.size();
            } else {
                alert("Não há mais histórico para desfazer!");
            }
        }
    </script>
</body>
</html>
