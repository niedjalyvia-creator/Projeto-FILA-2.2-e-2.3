<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Balanceamento de Parênteses</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; }
        .card { background: #fff; padding: 20px; border-radius: 8px; max-width: 400px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 8px; margin-top: 8px; margin-bottom: 12px; box-sizing: border-box; }
        button { background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2980b9; }
        .res { font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>2. Balanceamento de Parênteses</h2>
        <input type="text" id="exprInput" placeholder="Ex: (2 + 3) * (5 - 1)">
        <button onclick="verificarParenteses()">Verificar</button>
        <div class="res" id="resParenteses"></div>
    </div>

    <script>
        class Stack {
            constructor() { this.items = []; }
            push(el) { this.items.push(el); }
            pop() { return this.items.pop(); }
            isEmpty() { return this.items.length === 0; }
        }

        function verificarParenteses() {
            let expr = document.getElementById('exprInput').value;
            let divRes = document.getElementById('resParenteses');
            let pilha = new Stack();
            let valido = true;

            for (let char of expr) {
                if (char === '(') {
                    pilha.push(char);
                } else if (char === ')') {
                    if (pilha.isEmpty()) {
                        valido = false;
                        break;
                    }
                    pilha.pop();
                }
            }

            if (valido && pilha.isEmpty()) {
                divRes.innerText = "✔ Expressão Válida (balanceada)!";
                divRes.style.color = "green";
            } else {
                divRes.innerText = "✖ Expressão Inválida (não balanceada)!";
                divRes.style.color = "red";
            }
        }
    </script>
</body>
</html>
